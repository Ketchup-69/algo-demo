name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but never queue
# more than one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        env:
          # The single switch between user.github.io/algo-demo and a custom
          # domain. Blank this out (and add a CNAME) to move to an apex domain.
          NEXT_PUBLIC_BASE_PATH: /algo-demo
        run: npm run build

      - name: Ensure .nojekyll
        # Also committed at public/.nojekyll. Belt and braces: without it Pages
        # runs the output through Jekyll, which drops every _next/ directory.
        run: touch out/.nojekyll

      # ONE-TIME MANUAL SETUP REQUIRED:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # Until that is done this step fails with "Get Pages site failed / Not
      # Found". `enablement: true` does NOT solve it: creating a Pages site
      # needs repo admin, and the workflow GITHUB_TOKEN caps at `pages: write`,
      # which only permits deploying to a site that already exists. It fails
      # with "Resource not accessible by integration" instead. A repo admin has
      # to flip the switch once; every deploy after that is automatic.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
